name: Terraform CI/CD

on:
  push:
    branches:
      - feature/github-actions-pipeline

  pull_request:
    branches:
      - feature/github-actions-pipeline

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
        client-id: 25acc71a-cf92-4cb6-9c88-646878e3b993
        tenant-id: bc0de973-fa87-4900-94ad-2ac1ab72d129
        subscription-id: bf9f8ce4-b5e3-4c3e-ae91-0856d121c4e3

      - name: Verify Azure Login
        run: |
          az account show
          az account show --query "{Subscription:id,Tenant:tenantId,Name:name}" -o table

      - name: Terraform Init
        working-directory: ./enviroment/preprod
        run: terraform init

      - name: Terraform Format
        working-directory: ./enviroment/preprod
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ./enviroment/preprod
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./enviroment/preprod
        run: terraform plan